name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Rebuild daily at 00:00 UTC (09:00 KST) so scheduled posts
    # (future `date`) go live once their date has passed.
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    env:
      HUGO_VERSION: 0.147.6
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Collect IndexNow URLs
        id: indexnow
        run: |
          changed=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          fi
          urls=$(python3 .github/tools/indexnow_urls.py "${{ steps.pages.outputs.base_url }}" public $changed)
          echo "$urls"
          {
            echo "urls<<EOF"
            echo "$urls"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow_urls != ''
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
          INDEXNOW_KEY: 2a4dfe018498e30baff75ffcd428fb1a
        run: |
          payload=$(python3 -c 'import json,os; print(json.dumps({"host":"backpressured.dev","key":os.environ["INDEXNOW_KEY"],"keyLocation":"https://backpressured.dev/"+os.environ["INDEXNOW_KEY"]+".txt","urlList":os.environ["URLS"].split()}))')
          echo "$payload"
          code=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$payload")
          echo "IndexNow HTTP $code"
          # 200/202 = accepted; don't fail the deploy on IndexNow errors
