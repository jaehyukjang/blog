baseURL = "https://backpressured.dev/"
title = "Backpressured"
theme = "PaperMod"
googleAnalytics = "G-6NJNGQBTP2"
defaultContentLanguage = "ko"
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[pagination]
  pagerSize = 10

[params]
  author = "Jaehyuk Jang"
  description = "Hands-on data engineering — designing and operating production pipelines with CDC, Debezium, Flink, Iceberg, and Airflow, plus applying LLMs and AI agents to real data platform work. Problems from running data platforms at scale, and how they were solved."
  keywords = ["Data Engineering", "CDC", "Debezium", "Apache Flink", "Apache Iceberg", "Airflow", "Kafka", "dbt", "Data Pipeline", "Streaming", "LLM", "AI Agent", "RAG"]
  showReadingTime = true
  showShareButtons = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  comments = true
  defaultTheme = "auto"
  # env는 하드코딩하지 않음 — hugo.IsProduction으로 자동 판별.
  # `hugo` (배포): production → GA 켜짐 / `hugo server` (로컬): development → GA 꺼짐

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/jaehyuk-jang-bab185178"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jaehyukjang"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:jjhyuk92@gmail.com"

[languages]
  [languages.ko]
    languageCode = "ko"
    languageName = "한국어"
    weight = 1
    [languages.ko.params.homeInfoParams]
      Title = "Backpressured"
      Content = "Slowly draining the backlog"
