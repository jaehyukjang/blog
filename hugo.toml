googleAnalytics = "G-6NJNGQBTP2"
defaultContentLanguage = "ko"

[pagination]
  pagerSize = 10

[params]
  author = "Jaehyuk Jang"
  description = "Data Engineering Blog"
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  comments = true
  defaultTheme = "auto"
  env = "production"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/jaehyuk-jang-bab185178"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jaehyukjang"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:jjhyuk92@gmail.com"

[languages]
  [languages.ko]
    languageCode = "ko"
    languageName = "한국어"
